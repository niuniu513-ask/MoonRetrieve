name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update registry
        run: |
          moon version
          moon update
      - name: Test
        run: moon test --target ${{ matrix.target }}
      - name: CLI smoke test (native)
        if: matrix.target == 'native'
        run: |
          moon run cmd/main --target native -- index examples/notes smoke-index.json
          moon run cmd/main --target native -- query smoke-index.json "MoonBit" -k 3
          moon run cmd/main --target native -- stats smoke-index.json
      - name: Benchmark (native)
        if: matrix.target == 'native'
        run: moon bench --target native
      - name: Build library (wasm-gc)
        if: matrix.target == 'wasm-gc'
        run: moon build --target wasm-gc .
      - name: Check native
        if: matrix.target == 'native'
        run: moon check --target native
