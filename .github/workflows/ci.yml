name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-gc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update registry
        run: |
          moon version
          moon update
      - name: Test
        run: moon test --target ${{ matrix.target }}
        if: matrix.target == 'native'
      - name: Test library (wasm-gc)
        run: moon test --target wasm-gc -p niuniu513-ask/MoonSearch
        if: matrix.target == 'wasm-gc'
      - name: Build library (wasm-gc)
        if: matrix.target == 'wasm-gc'
        run: moon build --target wasm-gc .
      - name: Check native
        if: matrix.target == 'native'
        run: moon check --target native
